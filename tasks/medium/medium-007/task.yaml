id: medium-007
title: "SQL transform: roll up weekly active accounts from events"
difficulty: medium
category: sql-transformation
description: |
  Given a wide events table, produce a weekly active account count.
prompt: |
  The query in sql/weekly_active.sql currently produces wrong totals
  because it joins to accounts twice. Make the verifier pass; expected
  output is in sql/expected.csv.
verifier: |
  python -c "
  import csv, sqlite3
  con = sqlite3.connect(':memory:')
  with open('sql/schema.sql') as f: con.executescript(f.read())
  with open('sql/seed.sql')   as f: con.executescript(f.read())
  q = open('sql/weekly_active.sql').read()
  got = list(con.execute(q))
  expected = list(csv.reader(open('sql/expected.csv')))
  # Normalize
  expected_tuples = [(r[0], int(r[1])) for r in expected[1:]]
  assert got == expected_tuples, f'mismatch: {got} vs {expected_tuples}'
  print('OK')
  "
required_files:
  - sql/weekly_active.sql
  - sql/schema.sql
  - sql/seed.sql
  - sql/expected.csv
forbidden_modifications:
  - sql/expected.csv
  - sql/seed.sql
  - sql/schema.sql
files:
  - sql/weekly_active.sql
  - sql/schema.sql
  - sql/seed.sql
  - sql/expected.csv
