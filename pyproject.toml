[project]
name = "smart-routing-coding-benchmark"
version = "0.1.0"
description = "Reproducible benchmark of prompt-based model routing through Databricks Unity AI Gateway"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "requests>=2.32",
    "gitpython>=3.1",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.40.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
src-bench = "benchmark.runner.cli:main"
src-analyze = "benchmark.analysis.cli:main"
src-telemetry = "benchmark.telemetry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["benchmark"]
addopts = "-ra --strict-markers"
